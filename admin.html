<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Who opened · Mexico City 2027</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top"><a class="brand" href="/">Mexico City <span>2027</span></a><span class="who">Admin</span></header>
  <main>
    <h1>Who has opened the site</h1>
    <form class="admin-key" id="form">
      <input id="key" type="password" placeholder="Admin key" autocomplete="current-password" required>
      <button class="btn" type="submit">Show</button>
    </form>
    <p class="note" id="msg"></p>
    <div id="out"></div>
  </main>
  <script>
    (function () {
      var form = document.getElementById("form"), msg = document.getElementById("msg"), out = document.getElementById("out");
      function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
      function when(iso) { return iso ? new Date(iso).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }) : ""; }
      form.addEventListener("submit", function (e) {
        e.preventDefault();
        msg.textContent = "Loading...";
        fetch("/api/visits", { headers: { "x-admin-key": document.getElementById("key").value } })
          .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
          .then(function (res) {
            if (!res.ok) { msg.textContent = res.j.error || "Could not load."; out.innerHTML = ""; return; }
            msg.textContent = res.j.connected ? "" : "No database connected yet, so nothing is being recorded.";
            out.innerHTML = '<div class="card"><div class="table-wrap"><table><tr><th>Name</th><th>First opened</th><th>Last opened</th><th>Visits</th><th>Devices</th></tr>' +
              res.j.travelers.map(function (t) {
                return "<tr><td>" + esc(t.name) + "</td><td>" + (t.firstSeen ? esc(when(t.firstSeen)) : '<span class="pill warn">Not yet</span>') +
                  "</td><td>" + esc(when(t.lastSeen)) + "</td><td>" + esc(t.visits || "") + "</td><td>" + esc(t.devices || "") + "</td></tr>";
              }).join("") + "</table></div></div>";
          })
          .catch(function () { msg.textContent = "Could not reach the server."; });
      });
    })();
  </script>
</body>
</html>
